apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      tier: backend
      app: v1
  template:
    metadata:
      labels:
        tier: backend
        app: v1
    spec:
      containers:
      - name: nginx
        image: nginx:1.23.0
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"




# kubectl set image deployment/nginx nginx=nginx:1.23
# kubectl rollout history deployment nginx
# kubectl annotate deployment nginx kubernetes.io/change-cause="Pick up patch version"
# kubectl rollout undo deployment nginx
# kubectl rollout undo deployment nginx --to-revision=2


# It means your container does not have CPU or memory resource limits/requests defined.

# Why this warning happens

# In Kubernetes each container should ideally define:

# requests → minimum resources guaranteed

# limits → maximum resources the container can use

# If you don’t define them:

# A container can consume unlimited CPU/memory

# It may affect other pods on the same node

# This is called the “noisy neighbor” problem