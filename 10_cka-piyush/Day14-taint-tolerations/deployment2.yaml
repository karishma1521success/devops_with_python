apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deploy
  namespace: learning
  labels:
    app: redis
  annotations:
    owner: "karishma"
    environment: "uat"
    build-version: "latest"
    description: "information about this deployment"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "250Mi"
        ports:
        - containerPort: 80


