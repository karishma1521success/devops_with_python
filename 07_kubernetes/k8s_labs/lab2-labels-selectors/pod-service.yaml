---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-service-test
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx
      ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80  # port on which service will listen on - cluster IP Service port
      targetPort: 80  # port on which container is listening on - container port
