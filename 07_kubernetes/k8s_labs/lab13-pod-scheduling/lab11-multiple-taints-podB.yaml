---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-multiple-taints-deployment-podb
  annotations:
    reason: "podB-matches-only-second-taint"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "podB"
  template:
    metadata:
      labels:
        app: "podB"
    spec:
      tolerations:
        - key: "nodeName"
          operator: "Equal"
          value: "learning-worker"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: "storage"
                    operator: "In"
                    values:
                      - "na"
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "200Mi"
