---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multiple-node-labels-deployment2
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      tolerations:
        - key: "node"
          operator: "Equal"
          value: "worker2"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "storage"
                    operator: "In"
                    values:
                      - "sdd"
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
